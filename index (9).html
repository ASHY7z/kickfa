html[lang=en]{--body:'Inter',system-ui,sans-serif;--disp:'Oswald','Impact',sans-serif}
html[lang=fa]{--body:'Vazirmatn','Inter',system-ui,sans-serif;--disp:'Vazirmatn','Inter',sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:var(--ink)}
body{background:var(--ink);color:var(--tx);font-family:var(--body);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang=fa] body{line-height:1.9}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate}
svg{display:block}
/* header */
header{position:fixed;inset:0 0 auto;z-index:60;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.sc{background:rgba(7,11,9,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--ln)}
.bar{height:72px;padding-inline:var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.4rem;letter-spacing:-.025em;direction:ltr;line-height:1}
.brand b{color:var(--g);font-weight:800}
.lg{display:block;width:34px;height:29px;flex:none;background:var(--g);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat;filter:drop-shadow(0 0 10px rgba(83,252,24,.55));transition:transform .5s var(--spring)}
.brand:hover .lg{transform:rotate(-8deg) scale(1.08)}
.pill{position:absolute;inset-inline:0;margin-inline:auto;width:max-content;display:flex;gap:6px;padding:6px;border:1px solid var(--ln2);border-radius:999px;background:rgba(23,35,28,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill a{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;color:var(--mu);font-size:.92rem;font-weight:500;transition:color .2s,background .2s}
.pill a:hover,.pill a.on{color:var(--tx);background:rgba(255,255,255,.06)}
.pill svg{width:16px;height:16px}
.tools{display:flex;align-items:center;gap:10px}
/* header tools: donate + language switch */
.don{position:relative;display:inline-flex;align-items:center;gap:9px;height:42px;padding-inline:12px 18px;border-radius:999px;overflow:hidden;font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--tx);border:1px solid rgba(83,252,24,.45);background:linear-gradient(135deg,rgba(83,252,24,.20),rgba(83,252,24,.06)),rgba(23,35,28,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .35s var(--spring),box-shadow .3s,border-color .25s,color .25s}
.don::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.don .hi{position:relative;flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(160deg,#7dff4a,#53fc18 60%,#3fd10f);box-shadow:0 4px 14px -3px rgba(83,252,24,.7)}
.don .hi svg{width:14px;height:14px;fill:#06130a;stroke:#06130a;stroke-width:1.4;stroke-linejoin:round;animation:hb 1.8s var(--ease) infinite}
.don:hover{transform:translateY(-2px);border-color:var(--g);box-shadow:0 12px 30px -12px rgba(83,252,24,.65)}
.don:hover::after{transform:translateX(120%);transition:transform .8s var(--ease)}
@keyframes hb{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}42%{transform:scale(1.18)}}
.lang{position:relative;direction:ltr;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;height:42px;min-width:96px;padding:4px;border:1px solid var(--ln2);border-radius:999px;background:rgba(23,35,28,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;transition:border-color .25s,box-shadow .3s}
.lang:hover{border-color:var(--g);box-shadow:0 0 22px -8px rgba(83,252,24,.55)}
.lang::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(160deg,#7dff4a,#53fc18 60%,#3fd10f);box-shadow:0 0 16px rgba(83,252,24,.5),inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .5s var(--spring)}
.lang[data-l=fa]::before{transform:translateX(100%)}
.lang span{position:relative;z-index:1;display:grid;place-items:center;padding-inline:12px;font-size:.78rem;font-weight:800;letter-spacing:.04em;line-height:1;color:var(--mu);transition:color .3s}
.lang .f{font-family:'Vazirmatn','Inter',sans-serif;font-size:.9rem;letter-spacing:0}
.lang[data-l=en] .e,.lang[data-l=fa] .f{color:#06130a}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font-weight:600;font-size:.98rem;white-space:nowrap;transition:transform .25s var(--ease),background .25s,color .25s,box-shadow .25s}
.btn.w{background:#fff;color:#07100a}
.btn.w:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(83,252,24,.55)}
.btn.w svg{width:18px;height:18px;fill:#53fc18}
.btn.t{background:0;color:var(--tx);padding-inline:14px}
.btn.t:hover{color:var(--g)}.btn.t svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
.btn.g{border:1px solid var(--ln2);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(17,26,21,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx)}
.btn.g svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.btn.g .ext{width:13px;height:13px;stroke-width:2;opacity:.5;transition:transform .3s var(--spring),opacity .25s}
.btn.g:hover{transform:translateY(-2px);border-color:var(--g);color:var(--g);box-shadow:0 12px 30px -14px rgba(83,252,24,.6)}
.btn.g:hover .ext{opacity:1;transform:translate(2px,-2px)}
html[dir=rtl] .btn.g .ext{transform:scaleX(-1)}
html[dir=rtl] .btn.g:hover .ext{transform:scaleX(-1) translate(2px,-2px)}
.btn.sm{min-height:42px;padding:0 18px;font-size:.9rem}
.btn .x{margin-inline-start:2px;opacity:.55;font-size:1.1rem;line-height:1;padding:2px 4px;border-radius:6px}
.btn .x:hover{opacity:1}
.av{width:22px;height:22px;border-radius:50%;background:#53fc18;color:#06130a;display:grid;place-items:center;font-size:.72rem;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
/* stack */
.stack{position:relative}
.layer.a{position:sticky;top:0;z-index:0;background:var(--ink)}
.layer.b{position:relative;z-index:10;background:radial-gradient(800px 400px at 50% 0%,rgba(83,252,24,.06),transparent 70%),var(--ink)}
.shade{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:120px var(--pad) 80px;background:radial-gradient(900px 520px at 12% 22%,rgba(83,252,24,.11),transparent 70%),radial-gradient(700px 500px at 88% 70%,rgba(83,252,24,.08),transparent 70%),linear-gradient(180deg,#0b120e,#0f1813)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wm{position:absolute;inset-block:0;inset-inline-end:0;width:min(46vw,760px);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));pointer-events:none;transform:scale(.9);opacity:.95}
.hero .wm{inset-block:8% 4%;inset-inline-end:3%;animation:none}
.hc{position:relative;z-index:2;max-width:760px}
.eb{display:flex;align-items:baseline;flex-wrap:wrap;gap:14px;margin-bottom:22px;font-weight:700}
.eb strong{font-size:1.35rem;letter-spacing:-.01em}
.eb span{font-size:.78rem;letter-spacing:.2em;color:var(--dim);font-weight:600}
html[lang=fa] .eb span{letter-spacing:0;font-size:.9rem}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(3.2rem,9vw,7.4rem);line-height:.98;text-transform:uppercase;letter-spacing:-.005em;margin-bottom:30px}
html[lang=fa] h1{font-weight:900;text-transform:none;line-height:1.25;font-size:clamp(3rem,9vw,7rem)}
h1 .d{color:var(--dim)}
.rw{display:inline-block;opacity:0;transform:translateY(.38em);transition:opacity .6s var(--ease),transform .9s var(--spring)}
.in .rw{opacity:1;transform:none}
.sp{display:inline-block;width:.26em}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;color:var(--dim);font-size:.95rem;margin-bottom:20px}
.meta span{display:flex;align-items:center;gap:7px}
.meta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.meta i{font-style:normal;font-size:.72rem;font-weight:800;border:1px solid var(--dim);border-radius:4px;padding:1px 7px;letter-spacing:.05em}
.tag{font-weight:700;margin-bottom:16px}

  $$('.card').forEach(c=>{c.classList.remove('in');io.observe(c);c.style.transitionDelay=($$('.card').indexOf(c)*90)+'ms'});
  void b.offsetWidth;b.classList.remove('snap');enter();
}
$('#lang').onclick=()=>replay(()=>{lang=lang==='en'?'fa':'en';try{localStorage.setItem('kf-lang',lang)}catch(e){}applyLang()});

/* links */
function link(id,url,msg='soon'){const a=$(id);if(url){a.href=url;a.target='_blank';a.rel='noopener'}else{a.href='#';a.onclick=e=>{e.preventDefault();toast(t(msg))}}}
link('#chrome',CFG.CHROME_URL);link('#get',CFG.CHROME_URL);
link('#lnk-tg',CFG.TELEGRAM_URL);link('#lnk-kk',CFG.KICK_URL);link('#lnk-dn',CFG.DONATE_URL);link('#lnk-gh',CFG.GITHUB_URL);


/* header state + stack recede (hero scales to .9 and darkens as the next layer covers it) */
const hd=$('#hd'),inner=$('#inner'),shade=$('#shade'),nextEl=$('.layer.b'),phone=matchMedia('(max-width:639px)');
let raf=0;function onScroll(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
  hd.classList.toggle('sc',scrollY>24);
  if(RM)return;
  const view=innerHeight||1,shrink=phone.matches?0:.1;
  const p=Math.min(1,Math.max(0,1-nextEl.getBoundingClientRect().top/view));
  inner.style.transform=p>0&&shrink>0?`scale(${1-shrink*p})`:'';
  shade.style.opacity=.55*p;
  inner.style.visibility=p>=1?'hidden':'visible';
})}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);onScroll();

/* cards: reveal + cursor glow */
var io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -12% 0px'});
$$('.card').forEach((c,i)=>{c.style.transitionDelay=(i*90)+'ms';io.observe(c);
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});
  c.addEventListener('transitionend',()=>{c.style.transitionDelay='0ms'},{once:true})});

/* nav highlight */
const links=$$('.pill a[data-s]'),secs=['features','download','community'].map(id=>document.getElementById(id));
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=secs.indexOf(e.target);links.forEach((a,j)=>a.classList.toggle('on',j===i))}}),{rootMargin:'-45% 0px -45% 0px'});
secs.forEach(s=>so.observe(s));

/* ================= contour lines (marching squares) ================= */
(function(){
  const cv=$('#cn'),ctx=cv.getContext('2d');
  const LS=3.8,LC=2.5,WA=.37,WS=1.66,OP=.85,CELLS=96;
  const field=(x,y,t)=>{let f=Math.sin(x+t*.6)*.5;f+=Math.sin(y*.85-t*.45)*.45;f+=Math.sin((x+y)*.65+t*.35)*.35;f+=Math.sin((x-y)*.95-t*.55)*.25;return f*.5+.5};
  let w=0,h=0,vis=true,last=0,mx=-999,my=-999,tx=-999,ty=-999,ms=0,mt=0;
  addEventListener('pointermove',e=>{const b=cv.getBoundingClientRect();tx=e.clientX-b.left;ty=e.clientY-b.top;mt=(e.clientY>=b.top&&e.clientY<=b.bottom)?1:0;if(ms<.02){mx=tx;my=ty}},{passive:true});
  document.addEventListener('pointerleave',()=>{mt=0});const t0=performance.now();
  function size(){const r=Math.min(devicePixelRatio||1,2),b=cv.getBoundingClientRect();w=b.width;h=b.height;cv.width=w*r;cv.height=h*r;ctx.setTransform(r,0,0,r,0,0)}
  function draw(now){
    const t=(now-t0)/1000*WS;ctx.clearRect(0,0,w,h);
    mx+=(tx-mx)*.22;my+=(ty-my)*.22;ms+=(mt-ms)*.12;const R=Math.max(150,Math.min(w,h)*.2),inv=1/(2*R*R);
    const cols=w>=h?CELLS:Math.max(8,Math.round(CELLS*w/h)),rows=Math.max(8,Math.round(cols*h/w));
    const sx=w/cols,sy=h/rows,asp=w/h,V=new Float32Array((cols+1)*(rows+1));
    for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){
      const nx=((i/cols)*2-1)*asp*LS,ny=((j/rows)*2-1)*LS;
      let v=field(nx+Math.sin(ny*.8+t*.7)*WA,ny+Math.cos(nx*.7-t*.6)*WA,t);
      if(ms>.01){const dx=i*sx-mx,dy=j*sy-my;v+=ms*.34*Math.exp(-(dx*dx+dy*dy)*inv)}
      V[j*(cols+1)+i]=v*LC}
    ctx.strokeStyle='rgba(83,252,24,.22)';ctx.lineWidth=1;ctx.globalAlpha=OP;ctx.beginPath();
    for(let L=.5;L<LC;L+=1)for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const a=V[j*(cols+1)+i],b=V[j*(cols+1)+i+1],c=V[(j+1)*(cols+1)+i+1],d=V[(j+1)*(cols+1)+i];
      const k=(a>L?8:0)|(b>L?4:0)|(c>L?2:0)|(d>L?1:0);if(k===0||k===15)continue;
      const x0=i*sx,y0=j*sy,T=[x0+sx*((L-a)/(b-a)),y0],R=[x0+sx,y0+sy*((L-b)/(c-b))],B=[x0+sx*((L-d)/(c-d)),y0+sy],Lf=[x0,y0+sy*((L-a)/(d-a))];
      const seg=(p,q)=>{ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])};
      switch(k){case 1:case 14:seg(Lf,B);break;case 2:case 13:seg(B,R);break;case 3:case 12:seg(Lf,R);break;case 4:case 11:seg(T,R);break;case 6:case 9:seg(T,B);break;case 7:case 8:seg(Lf,T);break;case 5:seg(Lf,T);seg(B,R);break;case 10:seg(Lf,B);seg(T,R);break}}
    ctx.stroke();ctx.globalAlpha=1}
  function loop(now){requestAnimationFrame(loop);if(!vis||document.hidden||now-last<(ms>.02?16:24))return;last=now;draw(now)}
  size();addEventListener('resize',()=>{size();draw(performance.now())});
  new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(cv);
  draw(performance.now());if(!RM)requestAnimationFrame(loop);else mt=0;
})();

/* ================= cute follower ================= */
(function(){
  const pet=$('#pet');if(RM||!matchMedia('(hover:hover) and (pointer:fine)').matches){pet.style.display='none';return}
  const eyes=$$('.eye i',pet);
  let cx=0,cy=0,x=0,y=0,vx=0,vy=0,seen=false,last=performance.now();
  addEventListener('pointermove',e=>{cx=e.clientX;cy=e.clientY;if(!seen){seen=true;x=cx+24;y=cy+26;pet.classList.add('on')}
    pet.classList.toggle('happy',!!e.target.closest('a,button,.card'))},{passive:true});
  document.addEventListener('pointerleave',()=>pet.classList.remove('on'));
  document.addEventListener('pointerenter',()=>{if(seen)pet.classList.add('on')});
  setInterval(()=>{pet.classList.add('blink');setTimeout(()=>pet.classList.remove('blink'),140)},3200);
  (function tick(now){requestAnimationFrame(tick);
    const dt=Math.min(.05,(now-last)/1000);last=now;if(!seen)return;
    const tx=cx+26,ty=cy+28;
    vx+=((tx-x)*90-vx*11)*dt;vy+=((ty-y)*90-vy*11)*dt;x+=vx*dt;y+=vy*dt;
    const sp=Math.hypot(vx,vy),rot=Math.max(-28,Math.min(28,vx*.03)),st=Math.min(.18,sp/6000);
    pet.style.transform=`translate(${x-19}px,${y-19}px) rotate(${rot}deg) scale(${1+st},${1-st*.7})`;
    const dx=cx-x,dy=cy-y,d=Math.hypot(dx,dy)||1,k=Math.min(2.6,d/30);
    const px=(dx/d*k).toFixed(2)+'px',py=(dy/d*k).toFixed(2)+'px';
    eyes.forEach(e=>{e.style.setProperty('--px',px);e.style.setProperty('--py',py)});
  })(performance.now());
})();

applyLang();
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,900))]).then(()=>RM?(document.body.classList.remove('pre'),playH1()):enter());
